# ============================================================
# Group config — EDIT ME (one per group). Values here override
# the track defaults loaded from `track_config`.
# ============================================================
group_id: Nhóm NhăngNhăng                     # e.g. G07
owner: "Đặng Trung Hiếu (trưởng nhóm)"   # mandatory for every Decision
track_config: tracks/t05.yaml     # pick your challenge: tracks/t01.yaml ... tracks/t14.yaml
track: t05                        # must match track_config
input: fixtures/t05_near_duplicate  # or data/real/... if your instructor provided a real pack
output: out/poc                   # suspect_pairs.csv + split_manifest.csv land here
seed: 42
offline: true                     # demo/eval must not touch the network
strict_provenance: true           # fail if manifest.csv hashes do not match

# Track params (merged over track_config.params). Freeze before evaluation.
params:                           # M4: chosen on dev gold data/gold/gold_pairs.csv (47 pairs), FROZEN
  w_phash: 0.8                    # pHash similarity weight (structure, robust to brightness)
  w_hist: 0.2                     # colour-histogram weight (Bhattacharyya); colour alone hits the trap
  threshold: 0.757                # best F1 on gold (0.986), midpoint of score gap 0.635..0.879
